name: ci-powershell

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pester is the sole CI-only dependency: pwsh ships preinstalled on
      # all three GitHub-hosted runner images, and the script itself has
      # no dependency beyond the PowerShell standard library.
      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.6.0

      - name: Run PowerShell tests
        shell: pwsh
        run: Invoke-Pester -Path tests/powershell -CI
